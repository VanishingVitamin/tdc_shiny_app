name: Deploy to Posit Connect

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        run: |
          R -e 'install.packages(c("devtools", "rsconnect"))'
          R -e 'devtools::install(".")'

      - name: Publish to Posit Connect
        env:
          CONNECT_SERVER: ${{ secrets.PC_SERVER }}
          CONNECT_ACCOUNT: ${{ secrets.PC_ACCOUNT }}
          CONNECT_API_KEY: ${{ secrets.PC_API_KEY }}
        run: |
          R -e 'source("R/publish_app.R")'
